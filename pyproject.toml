[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noxguardian"
version = "1.0.0"
description = "Continuous presence and port monitoring for a home LAN, with Excel reporting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nostraxiten" }]
keywords = [
    "network-monitoring",
    "lan",
    "nmap",
    "arp-scan",
    "port-scanner",
    "device-tracking",
    "termux",
    "kali-linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = ["openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/nostraxiten/NoxGuardian"
Repository = "https://github.com/nostraxiten/NoxGuardian"
Issues = "https://github.com/nostraxiten/NoxGuardian/issues"
Changelog = "https://github.com/nostraxiten/NoxGuardian/blob/main/CHANGELOG.md"

[project.scripts]
noxguardian = "noxguardian.cli:main"

[tool.setuptools]
# Explicit package list: the repository root also holds a `noxguardian.py`
# launcher script, which auto-discovery would try to install as a module.
packages = ["noxguardian", "noxguardian.scanners", "noxguardian.exporters"]

[tool.setuptools.package-data]
noxguardian = ["data/*.csv"]
