name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Self-test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite performs no network access, so it runs unchanged on a runner.
      - name: Run self-test
        run: python tools/selftest.py

      - name: Verify the port profile resolves
        run: python -m noxguardian --list-ports | head -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install pyflakes

      - name: pyflakes
        run: python -m pyflakes noxguardian tools noxguardian.py

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      # Catches the classic packaging mistake of shipping a wheel without the
      # bundled OUI table, which would silently degrade vendor resolution.
      - name: Verify the OUI table is packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -q "noxguardian/data/oui_prefixes.csv"
          echo "OUI table present in the wheel"

      - name: Install the wheel and smoke-test the entry point
        run: |
          pip install dist/*.whl
          noxguardian --version
          noxguardian --list-ports | head -1
